[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forestlab"
version = "0.3.0"
description = "Inspectable CART hard-vote forests with exact split ordering and OOB membership"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = "MIT"

[tool.setuptools.packages.find]
include = ["forestlab*"]

[tool.setuptools.package-data]
forestlab = ["data/*.b64", "data/*.md", "artifacts/*.json", "artifacts/*.b64"]
